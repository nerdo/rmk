# 40-key split fixture: two morse keys pending at once under different modes.
# The home-row mods resolve by permissive hold; the layer thumb holds on any
# other key press, as an aurora-corne layer tap dance does.
[behavior.morse.profiles.hrm]
unilateral_tap = true
permissive_hold = true
hold_timeout = "250ms"
enable_flow_tap = false

[behavior.morse.profiles.thumb]
hold_on_other_press = true
hold_timeout = "350ms"

[layout]
rows = 4
cols = 10
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)  (0,5,R)  (0,6,R)  (0,7,R)  (0,8,R)  (0,9,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)  (1,5,R)  (1,6,R)  (1,7,R)  (1,8,R)  (1,9,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)  (2,5,R)  (2,6,R)  (2,7,R)  (2,8,R)  (2,9,R)
(3,0,L)  (3,1,L)  (3,2,L)  (3,3,*)  (3,4,*)  (3,5,*)  (3,6,*)  (3,7,R)  (3,8,R)  (3,9,R)
"""

[[keymap.layer]]
keys = """
Q   W                      E   R   T      Y   U   I   O                              P
No  MT(A, LGui, hrm)       S   D   F      G   H   J   MT(Semicolon, RGui, hrm)       No
Z   X                      C   V   B      N   M   No  No                             No
No  No                     No  No  LT(1, Space, thumb)  Enter  No  No  No            No
"""

[[keymap.layer]]
keys = """
No  No  No  No   No  No  No  No  No  No
No  No  No  Tab  No  No  No  No  No  No
No  No  No  No   No  No  No  No  No  No
No  No  No  No   _   No  No  No  No  No
"""
